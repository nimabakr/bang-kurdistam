name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, and build iOS app
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned release app
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned release app
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
